<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Short Vowel "Backup" Endings</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f0;
    color: #2c2c2a;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1vh 1vw;
  }
  .container {
    width: 100%;
    max-width: 1900px;
    height: 98vh;
    display: flex;
    flex-direction: column;
  }
  .tabs {
    display: flex;
    gap: 0.8vw;
    margin-bottom: 1.2vh;
    flex-shrink: 0;
  }
  .tab-btn {
    font-family: inherit;
    font-size: 2.25vw;
    font-weight: 600;
    padding: 1.8vh 2.7vw;
    background: white;
    color: #5f5e5a;
    border: 0.5px solid rgba(0,0,0,0.2);
    border-radius: 10px 10px 0 0;
    cursor: pointer;
  }
  .tab-btn.active { background: #2c2c2a; color: white; }
  .screen { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .screen.active { display: flex; }

  /* ---------- Screen 1: Word Sort ---------- */
  .board {
    position: relative;
    flex: 1;
    background: white;
    border: 0.5px solid rgba(0,0,0,0.15);
    border-radius: 12px;
    min-height: 0;
    overflow: hidden;
  }
  .divider-line {
    position: absolute;
    top: 0; bottom: 0; left: 50%;
    width: 1px;
    background: rgba(0,0,0,0.08);
    display: none;
  }
  .divider-line.show { display: block; }
  .word-card {
    position: absolute;
    background: #6b6b68;
    color: white;
    font-weight: 600;
    font-size: 2.25vw;
    padding: 1.5vh 1.95vw;
    border-radius: 11px;
    border: 3px solid transparent;
    transform: translate(-50%, -50%);
    transition: left 0.7s ease, top 0.7s ease, background 0.4s ease, box-shadow 0.2s ease;
    white-space: nowrap;
    user-select: none;
    cursor: grab;
  }
  .word-card.selected {
    outline: 4px dashed #2c2c2a;
    outline-offset: 3px;
  }
  .word-card.dragging {
    transition: none;
    cursor: grabbing;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    z-index: 50;
  }
  .word-card.staged {
    background: #2c2c2a;
    box-shadow: 0 0 0 4px rgba(44,44,42,0.15);
  }
  .word-card.clr-blue-fill { background: #185FA5; border-color: #185FA5; color: white; }
  .word-card.clr-blue-outline { background: white; border-color: #185FA5; color: #185FA5; }
  .word-card.clr-green-fill { background: #3E8E4A; border-color: #3E8E4A; color: white; }
  .word-card.clr-green-outline { background: white; border-color: #3E8E4A; color: #3E8E4A; }
  .word-card.clr-orange-fill { background: #BA7517; border-color: #BA7517; color: white; }
  .word-card.clr-orange-outline { background: white; border-color: #BA7517; color: #BA7517; }
  .word-card.clr-red-fill { background: #A32D2D; border-color: #A32D2D; color: white; }
  .word-card.clr-red-outline { background: white; border-color: #A32D2D; color: #A32D2D; }

  .swatch {
    width: 1.8vw;
    height: 1.8vw;
    border-radius: 50%;
    cursor: pointer;
    padding: 0;
  }
  .swatch.clr-blue-fill { background: #185FA5; border: 3px solid #185FA5; }
  .swatch.clr-blue-outline { background: white; border: 4px solid #185FA5; }
  .swatch.clr-green-fill { background: #3E8E4A; border: 3px solid #3E8E4A; }
  .swatch.clr-green-outline { background: white; border: 4px solid #3E8E4A; }
  .swatch.clr-orange-fill { background: #BA7517; border: 3px solid #BA7517; }
  .swatch.clr-orange-outline { background: white; border: 4px solid #BA7517; }
  .swatch.clr-red-fill { background: #A32D2D; border: 3px solid #A32D2D; }
  .swatch.clr-red-outline { background: white; border: 4px solid #A32D2D; }

  .controls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.7vw;
    justify-content: center;
    margin-top: 1.2vh;
    flex-shrink: 0;
  }
  .controls-label {
    font-size: 1.65vw;
    color: #5f5e5a;
    align-self: center;
    margin-right: 0.3vw;
  }
  button.ctrl {
    font-family: inherit;
    font-size: 1.875vw;
    padding: 1.65vh 2.1vw;
    background: white;
    color: #2c2c2a;
    border: 0.5px solid rgba(0,0,0,0.3);
    border-radius: 8px;
    cursor: pointer;
  }
  button.ctrl:hover { background: #f0eee7; }
  button.ctrl.primary { background: #2c2c2a; color: white; border-color: #2c2c2a; font-weight: 600; }
  button.ctrl.primary:hover { background: #444441; }
  button.ctrl.short-grp { border-color: #185FA5; color: #185FA5; }
  button.ctrl.long-grp { border-color: #A32D2D; color: #A32D2D; }

  /* ---------- Screen 2: Suffix Patterns ---------- */
  .suffix-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 3vh;
    background: white;
    border: 0.5px solid rgba(0,0,0,0.15);
    border-radius: 12px;
    padding: 3vh;
  }
  .pair-progress { font-size: 2.25vw; color: #5f5e5a; }
  .pair-row {
    display: flex;
    gap: 6vw;
    align-items: flex-start;
    justify-content: center;
  }
  .pair-col { display: flex; flex-direction: column; align-items: center; gap: 2vh; }
  .pair-base {
    font-size: 5.25vw;
    font-weight: 600;
    padding: 1vh 2vw;
    border-radius: 12px;
    background: #f0eee7;
  }
  .pair-col.short .pair-base { color: #185FA5; }
  .pair-col.long .pair-base { color: #A32D2D; }
  .pair-forms {
    font-size: 3.3vw;
    text-align: center;
    line-height: 1.6;
    min-height: 8vh;
    visibility: hidden;
  }
  .pair-forms.show { visibility: visible; }
  .pair-forms .double-hl { color: #A32D2D; font-weight: 700; }
  .pair-forms .single-hl { color: #3E8E4A; font-weight: 700; }
  .controls-label.warning {
    color: #A32D2D;
    font-weight: 700;
  }
  .suffix-controls { display: flex; gap: 1vw; }
</style>
</head>
<body>
<div class="container">
  <div class="tabs">
    <button class="tab-btn active" id="tabBtn1">1. Word Sort</button>
    <button class="tab-btn" id="tabBtn2">2. Suffix Patterns</button>
  </div>

  <div class="screen active" id="screen1">
    <div class="board" id="board">
      <div class="divider-line" id="dividerLine"></div>
    </div>
    <div class="controls-row">
      <button class="ctrl primary" id="restartBtn">Restart</button>
      <button class="ctrl primary" id="nextWordBtn">Next word →</button>
      <span class="controls-label" id="stagedLabel"></span>
      <button class="ctrl short-grp" id="sendShortBtn" disabled>← Short vowel</button>
      <button class="ctrl long-grp" id="sendLongBtn" disabled>Long vowel →</button>
      <span class="controls-label" id="sideCounts">Short: 0 · Long: 0</span>
    </div>
    <div class="controls-row">
      <span class="controls-label">Click cards to select, then tap a color. Filled = short side, outline = its long-vowel match.</span>
    </div>
    <div class="controls-row">
      <button class="swatch clr-blue-fill" data-color="clr-blue-fill" title="Blue fill"></button>
      <button class="swatch clr-blue-outline" data-color="clr-blue-outline" title="Blue outline"></button>
      <button class="swatch clr-green-fill" data-color="clr-green-fill" title="Green fill"></button>
      <button class="swatch clr-green-outline" data-color="clr-green-outline" title="Green outline"></button>
      <button class="swatch clr-orange-fill" data-color="clr-orange-fill" title="Orange fill"></button>
      <button class="swatch clr-orange-outline" data-color="clr-orange-outline" title="Orange outline"></button>
      <button class="swatch clr-red-fill" data-color="clr-red-fill" title="Red fill"></button>
      <button class="swatch clr-red-outline" data-color="clr-red-outline" title="Red outline"></button>
      <button class="ctrl" id="clearColorBtn">Clear color</button>
      <button class="ctrl" id="answerKeyBtn">Show answer key</button>
    </div>
  </div>

  <div class="screen" id="screen2">
    <div class="suffix-wrap">
      <div class="pair-progress" id="pairProgress">Pair 1 of 8</div>
      <div class="pair-row">
        <div class="pair-col short">
          <div class="pair-base" id="shortBase">hop</div>
          <div class="pair-forms" id="shortForms">hopp<span class="double-hl">ing</span> / hopp<span class="double-hl">ed</span></div>
        </div>
        <div class="pair-col long">
          <div class="pair-base" id="longBase">hope</div>
          <div class="pair-forms" id="longForms">hop<span class="single-hl">ing</span> / hop<span class="single-hl">ed</span></div>
        </div>
      </div>
      <div class="suffix-controls">
        <button class="ctrl primary" id="revealBtn">Reveal endings</button>
        <button class="ctrl" id="prevPairBtn">← Previous pair</button>
        <button class="ctrl" id="nextPairBtn">Next pair →</button>
      </div>
    </div>
  </div>
</div>

<script>
/* B5 content editor — shared by the Classroom-Games suite.
   Saved per browser in localStorage. Supports several named lists,
   a table editor, a "paste many" text box, and Reset to defaults. */
(function () {
  var CSS = '' +
  '.b5e-btn{position:fixed;right:12px;bottom:12px;z-index:9000;font:600 14px/1 -apple-system,"Segoe UI",sans-serif;background:#fff;color:#2c2c2a;border:1px solid rgba(0,0,0,.25);border-radius:20px;padding:9px 14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12);opacity:.85}' +
  '.b5e-btn:hover{opacity:1}' +
  '.b5e-ov{position:fixed;inset:0;z-index:9500;background:rgba(20,20,18,.55);display:none;align-items:center;justify-content:center;font:15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;color:#2c2c2a}' +
  '.b5e-ov.open{display:flex}' +
  '.b5e-box{background:#fff;border-radius:14px;width:min(1000px,96vw);height:min(760px,94vh);display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.3)}' +
  '.b5e-head{padding:14px 18px 10px;border-bottom:1px solid #e6e4dd}' +
  '.b5e-head h2{font-size:20px;font-weight:600;margin:0 0 8px}' +
  '.b5e-lists{display:flex;flex-wrap:wrap;gap:6px;align-items:center}' +
  '.b5e-lists select,.b5e-lists input{font:inherit;padding:5px 8px;border:1px solid #c9c6bd;border-radius:6px}' +
  '.b5e-lists input{width:220px}' +
  '.b5e-help{font-size:13px;color:#66645e;margin-top:6px}' +
  '.b5e-body{flex:1;overflow:auto;padding:10px 18px}' +
  '.b5e-set{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:10px;padding:8px 10px;background:#f6f5f0;border-radius:8px}' +
  '.b5e-set label{font-size:13px;display:flex;gap:6px;align-items:center}' +
  '.b5e-set input,.b5e-set select{font:inherit;padding:3px 6px;border:1px solid #c9c6bd;border-radius:5px}' +
  '.b5e-tbl{width:100%;border-collapse:collapse}' +
  '.b5e-tbl th{text-align:left;font-size:12px;letter-spacing:.5px;color:#66645e;padding:4px;position:sticky;top:-10px;background:#fff}' +
  '.b5e-tbl td{padding:3px 4px;vertical-align:top}' +
  '.b5e-tbl td.n{color:#99968e;font-size:12px;width:26px;padding-top:9px}' +
  '.b5e-tbl input,.b5e-tbl select,.b5e-tbl textarea{width:100%;font:inherit;padding:5px 7px;border:1px solid #d4d1c8;border-radius:5px;background:#fff}' +
  '.b5e-tbl textarea{min-height:34px;resize:vertical}' +
  '.b5e-x{border:none;background:none;color:#a33;font-size:18px;cursor:pointer;padding:4px 6px}' +
  '.b5e-act{font:inherit;font-size:12px;padding:5px 8px;border:1px solid #c9c6bd;border-radius:5px;background:#f6f5f0;cursor:pointer;white-space:nowrap}' +
  '.b5e-bulk{width:100%;height:100%;min-height:360px;font:14px/1.5 ui-monospace,Consolas,monospace;padding:10px;border:1px solid #c9c6bd;border-radius:8px}' +
  '.b5e-foot{padding:10px 18px;border-top:1px solid #e6e4dd;display:flex;flex-wrap:wrap;gap:8px;align-items:center}' +
  '.b5e-foot .sp{flex:1}' +
  '.b5e-b{font:inherit;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid #c9c6bd;background:#fff;cursor:pointer}' +
  '.b5e-b.pri{background:#1a5fa8;border-color:#1a5fa8;color:#fff;font-weight:600}' +
  '.b5e-b.warn{color:#a33}' +
  '.b5e-msg{font-size:13px;color:#a33;min-height:18px}' +
  '.b5e-msg.ok{color:#1a6b3a}';

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  function clone(x) { return JSON.parse(JSON.stringify(x)); }

  function B5Edit(cfg) {
    var self = this;
    this.cfg = cfg;
    this.cols = cfg.columns;
    this.key = 'b5edit:' + cfg.key;
    this.defaultName = cfg.defaultName || 'Default list';
    this.listeners = [];
    if (cfg.onChange) this.listeners.push(cfg.onChange);
    this.state = this._load();
    if (!document.getElementById('b5e-css')) {
      var st = el('style', { id: 'b5e-css' }); st.textContent = CSS; document.head.appendChild(st);
    }
    this._build();
    if (cfg.button !== false) {
      var host = cfg.buttonHost ? (typeof cfg.buttonHost === 'string' ? document.querySelector(cfg.buttonHost) : cfg.buttonHost) : null;
      var b = el('button', { 'class': host ? (cfg.buttonClass || '') : 'b5e-btn', type: 'button', text: cfg.buttonLabel || '⚙ Edit content', onclick: function () { self.open(); } });
      if (host) host.appendChild(b); else document.body.appendChild(b);
      this.button = b;
    }
  }

  B5Edit.prototype._defaults = function () {
    var s = {};
    (this.cfg.settings || []).forEach(function (f) { s[f.key] = f.default; });
    return { v: 1, current: 'default', settings: s,
      lists: [{ id: 'default', name: this.defaultName, rows: clone(this.cfg.defaults) }] };
  };
  B5Edit.prototype._load = function () {
    var d = this._defaults();
    try {
      var raw = localStorage.getItem(this.key);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && Array.isArray(s.lists) && s.lists.length) {
          s.settings = Object.assign({}, d.settings, s.settings || {});
          if (!s.lists.some(function (l) { return l.id === s.current; })) s.current = s.lists[0].id;
          return s;
        }
      }
    } catch (e) {}
    return d;
  };
  B5Edit.prototype._save = function () {
    try { localStorage.setItem(this.key, JSON.stringify(this.state)); } catch (e) {}
  };
  B5Edit.prototype._cur = function () {
    var st = this.state;
    return st.lists.filter(function (l) { return l.id === st.current; })[0] || st.lists[0];
  };
  /* public API */
  B5Edit.prototype.rows = function () { return clone(this._cur().rows); };
  B5Edit.prototype.listName = function () { return this._cur().name; };
  B5Edit.prototype.settings = function () { return clone(this.state.settings); };
  B5Edit.prototype.onChange = function (fn) { this.listeners.push(fn); };
  B5Edit.prototype.listNames = function () { return this.state.lists.map(function (l) { return { id: l.id, name: l.name }; }); };
  B5Edit.prototype.useList = function (id) {
    if (this.state.lists.some(function (l) { return l.id === id; })) { this.state.current = id; this._save(); this._fire(); }
  };
  B5Edit.prototype._fire = function () {
    var self = this;
    this.listeners.forEach(function (fn) { try { fn(self.rows(), self.settings(), self.listName()); } catch (e) { console.error(e); } });
  };

  /* ---------- UI ---------- */
  B5Edit.prototype._build = function () {
    var self = this, cfg = this.cfg;
    this.ov = el('div', { 'class': 'b5e-ov' });
    this.sel = el('select', { onchange: function () { self._pull(); self.work.current = self.sel.value; self._render(); } });
    this.nameIn = el('input', { placeholder: 'List name', oninput: function () { self._curW().name = self.nameIn.value; self._fillSel(); } });
    var lists = el('div', { 'class': 'b5e-lists' }, [
      el('span', { text: 'List:' }), this.sel, this.nameIn,
      el('button', { 'class': 'b5e-act', type: 'button', text: '+ New list', onclick: function () { self._newList(false); } }),
      el('button', { 'class': 'b5e-act', type: 'button', text: 'Copy list', onclick: function () { self._newList(true); } }),
      el('button', { 'class': 'b5e-act', type: 'button', text: 'Delete list', onclick: function () { self._delList(); } })
    ]);
    var help = el('div', { 'class': 'b5e-help', html: cfg.help || '' });
    this.body = el('div', { 'class': 'b5e-body' });
    this.msg = el('div', { 'class': 'b5e-msg' });
    this.bulkBtn = el('button', { 'class': 'b5e-b', type: 'button', text: 'Paste many', onclick: function () { self._toggleBulk(); } });
    var foot = el('div', { 'class': 'b5e-foot' }, [
      el('button', { 'class': 'b5e-b', type: 'button', text: '+ Add row', onclick: function () { self._pull(); self._curW().rows.push(self._blank()); self._render(); self.body.scrollTop = 1e6; } }),
      this.bulkBtn,
      el('button', { 'class': 'b5e-b warn', type: 'button', text: 'Reset to defaults', onclick: function () { self._reset(); } }),
      el('div', { 'class': 'sp' }, [this.msg]),
      el('button', { 'class': 'b5e-b', type: 'button', text: 'Cancel', onclick: function () { self.close(); } }),
      el('button', { 'class': 'b5e-b pri', type: 'button', text: 'Save', onclick: function () { self._commit(); } })
    ]);
    this.box = el('div', { 'class': 'b5e-box' }, [
      el('div', { 'class': 'b5e-head' }, [el('h2', { text: cfg.title || 'Edit content' }), lists, help]),
      this.body, foot
    ]);
    this.ov.appendChild(this.box);
    this.ov.addEventListener('keydown', function (e) { e.stopPropagation(); if (e.key === 'Escape') self.close(); });
    this.ov.addEventListener('keyup', function (e) { e.stopPropagation(); });
    this.ov.addEventListener('keypress', function (e) { e.stopPropagation(); });
    document.body.appendChild(this.ov);
  };
  B5Edit.prototype._blank = function () { var r = {}; this.cols.forEach(function (c) { r[c.key] = c.options ? c.options[0].value !== undefined ? c.options[0].value : c.options[0] : ''; }); return r; };
  B5Edit.prototype._curW = function () { var w = this.work; return w.lists.filter(function (l) { return l.id === w.current; })[0]; };
  B5Edit.prototype._fillSel = function () {
    var w = this.work, sel = this.sel; sel.innerHTML = '';
    w.lists.forEach(function (l) { sel.appendChild(el('option', { value: l.id, text: l.name || '(no name)' })); });
    sel.value = w.current;
  };
  B5Edit.prototype.open = function () {
    this.work = clone(this.state); this.bulk = false; this.bulkBtn.textContent = 'Paste many';
    this.msg.textContent = ''; this._render(); this.ov.classList.add('open');
    if (this.cfg.onOpen) this.cfg.onOpen();
  };
  B5Edit.prototype.close = function () { this.ov.classList.remove('open'); if (this.cfg.onClose) this.cfg.onClose(); };
  B5Edit.prototype._optVal = function (o) { return o && o.value !== undefined ? o.value : o; };
  B5Edit.prototype._render = function () {
    var self = this, cfg = this.cfg, L = this._curW();
    this._fillSel(); this.nameIn.value = L.name;
    this.body.innerHTML = '';
    if ((cfg.settings || []).length) {
      var set = el('div', { 'class': 'b5e-set' });
      cfg.settings.forEach(function (f) {
        var v = self.work.settings[f.key], inp;
        if (f.type === 'select') {
          inp = el('select', { 'data-k': f.key });
          f.options.forEach(function (o) { inp.appendChild(el('option', { value: String(self._optVal(o)), text: o.label || String(o) })); });
          inp.value = String(v);
        } else if (f.type === 'checkbox') {
          inp = el('input', { type: 'checkbox', 'data-k': f.key }); inp.checked = !!v;
        } else {
          inp = el('input', { type: f.type || 'text', 'data-k': f.key, value: v == null ? '' : v, style: 'width:' + (f.width || 90) + 'px' });
          if (f.min != null) inp.min = f.min; if (f.max != null) inp.max = f.max;
        }
        set.appendChild(el('label', {}, [el('span', { text: f.label }), inp]));
      });
      this.body.appendChild(set);
      this.setBox = set;
    } else this.setBox = null;
    if (this.bulk) {
      var fmt = this.cols.map(function (c) { return c.label; }).join(' | ');
      this.body.appendChild(el('div', { 'class': 'b5e-help', text: 'One row per line. ' + (this.cols.length > 1 ? 'Separate the boxes with | like this:  ' + fmt : '') }));
      this.ta = el('textarea', { 'class': 'b5e-bulk' });
      this.ta.value = L.rows.map(function (r) { return self.cols.map(function (c) { return r[c.key] == null ? '' : String(r[c.key]); }).join(' | '); }).join('\n');
      this.body.appendChild(this.ta);
      return;
    }
    var tbl = el('table', { 'class': 'b5e-tbl' });
    var hr = el('tr', {}, [el('th', { text: '#' })]);
    this.cols.forEach(function (c) { hr.appendChild(el('th', { text: c.label, style: c.width ? 'width:' + c.width : '' })); });
    if (cfg.rowAction) hr.appendChild(el('th'));
    hr.appendChild(el('th'));
    tbl.appendChild(hr);
    L.rows.forEach(function (r, i) {
      var tr = el('tr', {}, [el('td', { 'class': 'n', text: String(i + 1) })]);
      self.cols.forEach(function (c) {
        var inp, v = r[c.key] == null ? '' : r[c.key];
        if (c.options) {
          inp = el('select');
          c.options.forEach(function (o) { inp.appendChild(el('option', { value: String(self._optVal(o)), text: o.label || String(o) })); });
          inp.value = String(v);
        } else if (c.multiline) { inp = el('textarea', { placeholder: c.placeholder || '' }); inp.value = v; }
        else inp = el('input', { value: v, placeholder: c.placeholder || '' });
        inp.setAttribute('data-k', c.key);
        tr.appendChild(el('td', {}, [inp]));
      });
      if (cfg.rowAction) tr.appendChild(el('td', {}, [el('button', { 'class': 'b5e-act', type: 'button', text: cfg.rowAction.label, onclick: function () { self._rowAct(i); } })]));
      tr.appendChild(el('td', {}, [el('button', { 'class': 'b5e-x', type: 'button', title: 'Delete row', text: '×', onclick: function () { self._pull(); self._curW().rows.splice(i, 1); self._render(); } })]));
      tbl.appendChild(tr);
    });
    this.body.appendChild(tbl);
    this.tbl = tbl;
  };
  B5Edit.prototype._pull = function () {
    var self = this, L = this._curW();
    if (!L) return;
    if (this.setBox) {
      [].forEach.call(this.setBox.querySelectorAll('[data-k]'), function (inp) {
        var k = inp.getAttribute('data-k'), f = self.cfg.settings.filter(function (s) { return s.key === k; })[0];
        var v = inp.type === 'checkbox' ? inp.checked : inp.value;
        if (f && (f.type === 'number' || typeof f.default === 'number') && inp.type !== 'checkbox') v = Number(v);
        self.work.settings[k] = v;
      });
    }
    if (this.bulk) {
      L.rows = this.ta.value.split('\n').map(function (line) { return line.trim(); }).filter(Boolean).map(function (line) {
        var parts = self.cols.length > 1 ? line.split('|') : [line], r = {};
        self.cols.forEach(function (c, i) { r[c.key] = (parts[i] || '').trim(); });
        return r;
      });
      return;
    }
    var trs = this.tbl ? this.tbl.querySelectorAll('tr') : [];
    var rows = [];
    for (var i = 1; i < trs.length; i++) {
      var r = {};
      [].forEach.call(trs[i].querySelectorAll('[data-k]'), function (inp) { r[inp.getAttribute('data-k')] = inp.value.trim(); });
      rows.push(r);
    }
    L.rows = rows;
  };
  B5Edit.prototype._toggleBulk = function () {
    this._pull(); this.bulk = !this.bulk;
    this.bulkBtn.textContent = this.bulk ? 'Table view' : 'Paste many';
    this._render();
  };
  B5Edit.prototype._newList = function (copy) {
    this._pull();
    var cur = this._curW(), id = 'l' + Date.now();
    var L = { id: id, name: copy ? cur.name + ' (copy)' : 'New list', rows: copy ? clone(cur.rows) : [this._blank()] };
    this.work.lists.push(L); this.work.current = id; this._render(); this.nameIn.focus(); this.nameIn.select();
  };
  B5Edit.prototype._delList = function () {
    if (this.work.lists.length < 2) { this._say('You need at least one list.'); return; }
    if (!confirm('Delete the list "' + this._curW().name + '"?')) return;
    var w = this.work; w.lists = w.lists.filter(function (l) { return l.id !== w.current; });
    w.current = w.lists[0].id; this._render();
  };
  B5Edit.prototype._reset = function () {
    if (!confirm('Bring back the original list and settings? Your other lists stay.')) return;
    var d = this._defaults(), w = this.work;
    var has = w.lists.filter(function (l) { return l.id === 'default'; })[0];
    if (has) { has.rows = d.lists[0].rows; has.name = d.lists[0].name; } else w.lists.unshift(d.lists[0]);
    w.settings = d.settings; w.current = 'default'; this._render(); this._say('Defaults restored. Press Save to use them.', true);
  };
  B5Edit.prototype._rowAct = function (i) {
    var self = this; this._pull();
    var L = this._curW(), r = L.rows[i];
    this._say('Working…', true);
    Promise.resolve(this.cfg.rowAction.run(clone(r))).then(function (nr) {
      if (nr) { L.rows[i] = nr; self._render(); }
      self._say('', true);
    }).catch(function (e) { self._say(String(e && e.message || e)); });
  };
  B5Edit.prototype._say = function (t, ok) { this.msg.textContent = t; this.msg.className = 'b5e-msg' + (ok ? ' ok' : ''); };
  B5Edit.prototype._commit = function () {
    this._pull();
    var self = this, w = this.work;
    // drop fully empty rows
    w.lists.forEach(function (L) {
      L.rows = L.rows.filter(function (r) { return self.cols.some(function (c) { return !c.options && String(r[c.key] || '').trim() !== ''; }) || self.cols.every(function (c) { return c.options; }); });
      if (self.cfg.clean) L.rows = L.rows.map(self.cfg.clean);
      if (!L.name) L.name = 'Untitled list';
    });
    var L = this._curW();
    var err = this.cfg.validate ? this.cfg.validate(L.rows, w.settings) : '';
    if (!err && this.cfg.min && L.rows.length < this.cfg.min) err = 'This list needs at least ' + this.cfg.min + ' rows.';
    if (err) { this._say(err); this._render(); return; }
    this.state = w; this._save(); this.close(); this._fire();
  };

  window.B5Edit = B5Edit;
})();

</script>
<script>
(function() {
  // ===================== SCREEN 1: WORD SORT =====================
  const DEF_WORDS = [
    { w: "back", vowel: "short", sub: "ck" },
    { w: "sock", vowel: "short", sub: "ck" },
    { w: "duck", vowel: "short", sub: "ck" },
    { w: "catch", vowel: "short", sub: "tch" },
    { w: "pitch", vowel: "short", sub: "tch" },
    { w: "hutch", vowel: "short", sub: "tch" },
    { w: "badge", vowel: "short", sub: "dge" },
    { w: "edge", vowel: "short", sub: "dge" },
    { w: "judge", vowel: "short", sub: "dge" },
    { w: "spell", vowel: "short", sub: "floss" },
    { w: "glass", vowel: "short", sub: "floss" },
    { w: "buzz", vowel: "short", sub: "floss" },
    { w: "oak", vowel: "long", sub: "k" },
    { w: "leak", vowel: "long", sub: "k" },
    { w: "soak", vowel: "long", sub: "k" },
    { w: "reach", vowel: "long", sub: "ch" },
    { w: "beach", vowel: "long", sub: "ch" },
    { w: "coach", vowel: "long", sub: "ch" },
    { w: "cage", vowel: "long", sub: "ge" },
    { w: "huge", vowel: "long", sub: "ge" },
    { w: "page", vowel: "long", sub: "ge" },
    { w: "seal", vowel: "long", sub: "single" },
    { w: "wheel", vowel: "long", sub: "single" },
    { w: "leaf", vowel: "long", sub: "single" }
  ];
  const ED = new B5Edit({ key: "short-vowel-endings-sort", title: "Word sort words", defaultName: "Backup endings",
    help: "Screen 1 word sort. The ending decides the answer-key color.",
    columns: [{ key: "w", label: "Word" }, { key: "vowel", label: "Vowel", width: "110px", options: [{ value: "short", label: "Short" }, { value: "long", label: "Long" }] },
              { key: "sub", label: "Ending", width: "230px", options: [{"value": "ck", "label": "-ck (short)"}, {"value": "k", "label": "-k (long)"}, {"value": "tch", "label": "-tch (short)"}, {"value": "ch", "label": "-ch (long)"}, {"value": "dge", "label": "-dge (short)"}, {"value": "ge", "label": "-ge (long)"}, {"value": "floss", "label": "floss ff/ll/ss/zz (short)"}, {"value": "single", "label": "single letter (long)"}] }],
    defaults: DEF_WORDS, min: 2, onChange: function(){ location.reload(); } });
  const words = ED.rows();

  const board = document.getElementById("board");
  const dividerLine = document.getElementById("dividerLine");
  const cardEls = {};

  function makeGridPositions(count, xMin, xMax, yMin, yMax, cols) {
    const rows = Math.ceil(count / cols);
    const cellW = (xMax - xMin) / cols;
    const cellH = (yMax - yMin) / rows;
    const positions = [];
    for (let i = 0; i < count; i++) {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const jitterX = (Math.random() - 0.5) * cellW * 0.5;
      const jitterY = (Math.random() - 0.5) * cellH * 0.5;
      positions.push({ x: xMin + cellW * (col + 0.5) + jitterX, y: yMin + cellH * (row + 0.5) + jitterY });
    }
    for (let i = positions.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [positions[i], positions[j]] = [positions[j], positions[i]];
    }
    return positions;
  }

  let queue = [];
  let staged = null;
  let shortCount = 0;
  let longCount = 0;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Computes a position on demand for the nth card sent to a side, instead of
  // pulling from a fixed-size pool - so there's no ceiling if more than 12
  // words end up on one side (which can happen if a word is misjudged).
  function scatterPosition(index, xMin, xMax, yMin, yMax, cols) {
    const col = index % cols;
    const row = Math.floor(index / cols);
    const cellW = (xMax - xMin) / cols;
    const cellH = (yMax - yMin) / 8; // supports up to 8 rows (24 cards) per side without shrinking
    const jitterX = (Math.random() - 0.5) * cellW * 0.5;
    const jitterY = (Math.random() - 0.5) * Math.min(cellH, 9) * 0.6;
    return {
      x: xMin + cellW * (col + 0.5) + jitterX,
      y: Math.min(yMax, yMin + cellH * (row + 0.5)) + jitterY
    };
  }

  function updateSideCounts() {
    let s = 0, l = 0;
    Object.keys(cardEls).forEach(function(w) {
      const el = cardEls[w];
      if (el.classList.contains("staged")) return;
      const leftPct = parseFloat(el.style.left);
      if (isNaN(leftPct)) return;
      if (leftPct < 50) s++; else l++;
    });
    const label = document.getElementById("sideCounts");
    let msg = "Short: " + s + " · Long: " + l;
    const imbalanced = s > 12 || l > 12;
    if (s > 12) msg += " — Short side looks too full. Check for a word that belongs on the other side.";
    if (l > 12) msg += " — Long side looks too full. Check for a word that belongs on the other side.";
    label.textContent = msg;
    label.classList.toggle("warning", imbalanced);
  }

  function makeInteractive(el) {
    el.addEventListener("pointerdown", function(e) {
      el.setPointerCapture(e.pointerId);
      const startX = e.clientX, startY = e.clientY;
      let moved = false;
      const boardRect = board.getBoundingClientRect();
      function onMove(ev) {
        const dx = ev.clientX - startX, dy = ev.clientY - startY;
        if (!moved && Math.hypot(dx, dy) > 6) {
          moved = true;
          el.classList.add("dragging");
        }
        if (moved) {
          let x = ((ev.clientX - boardRect.left) / boardRect.width) * 100;
          let y = ((ev.clientY - boardRect.top) / boardRect.height) * 100;
          x = Math.max(2, Math.min(98, x));
          y = Math.max(4, Math.min(96, y));
          el.style.left = x + "%";
          el.style.top = y + "%";
        }
      }
      function onUp(ev) {
        el.classList.remove("dragging");
        el.removeEventListener("pointermove", onMove);
        el.removeEventListener("pointerup", onUp);
        if (!moved) {
          el.classList.toggle("selected");
        } else {
          updateSideCounts();
        }
      }
      el.addEventListener("pointermove", onMove);
      el.addEventListener("pointerup", onUp);
    });
  }

  const colorClasses = ["clr-blue-fill","clr-blue-outline","clr-green-fill","clr-green-outline",
                         "clr-orange-fill","clr-orange-outline","clr-red-fill","clr-red-outline"];

  function applyColorToSelected(colorClass) {
    document.querySelectorAll(".word-card.selected").forEach(function(el) {
      colorClasses.forEach(function(c) { el.classList.remove(c); });
      if (colorClass) el.classList.add(colorClass);
      el.classList.remove("selected");
    });
  }

  function resetBoard() {
    Object.values(cardEls).forEach(function(el) { el.remove(); });
    for (const k in cardEls) delete cardEls[k];
    queue = shuffle(words);
    staged = null;
    shortCount = 0;
    longCount = 0;
    dividerLine.classList.add("show");
    document.getElementById("stagedLabel").textContent = "";
    document.getElementById("sendShortBtn").disabled = true;
    document.getElementById("sendLongBtn").disabled = true;
    document.getElementById("nextWordBtn").disabled = false;
    keyVisible = false;
    document.getElementById("answerKeyBtn").textContent = "Show answer key";
    updateSideCounts();
  }

  function nextWord() {
    if (staged) return; // must place current word first
    if (queue.length === 0) {
      document.getElementById("nextWordBtn").disabled = true;
      document.getElementById("stagedLabel").textContent = "All " + words.length + " words placed.";
      return;
    }
    staged = queue.shift();
    const el = document.createElement("div");
    el.className = "word-card staged";
    el.textContent = staged.w;
    el.style.left = "50%";
    el.style.top = "6%";
    board.appendChild(el);
    cardEls[staged.w] = el;
    document.getElementById("stagedLabel").textContent = "Placing: " + staged.w;
    document.getElementById("sendShortBtn").disabled = false;
    document.getElementById("sendLongBtn").disabled = false;
  }

  function sendStaged(side) {
    if (!staged) return;
    const el = cardEls[staged.w];
    el.classList.remove("staged");
    let pos;
    if (side === "short") {
      pos = scatterPosition(shortCount++, 4, 46, 12, 88, 3);
    } else {
      pos = scatterPosition(longCount++, 54, 96, 12, 88, 3);
    }
    el.style.left = pos.x + "%";
    el.style.top = pos.y + "%";
    makeInteractive(el);
    staged = null;
    document.getElementById("stagedLabel").textContent = "";
    document.getElementById("sendShortBtn").disabled = true;
    document.getElementById("sendLongBtn").disabled = true;
    updateSideCounts();
  }

  const answerColorMap = {
    ck: "clr-blue-fill", k: "clr-blue-outline",
    tch: "clr-green-fill", ch: "clr-green-outline",
    dge: "clr-orange-fill", ge: "clr-orange-outline",
    floss: "clr-red-fill", single: "clr-red-outline"
  };

  let keyVisible = false;

  function showAnswerKey() {
    words.forEach(function(item) {
      const el = cardEls[item.w];
      if (el) {
        colorClasses.forEach(function(c) { el.classList.remove(c); });
        el.classList.remove("selected");
        el.classList.add(answerColorMap[item.sub]);
      }
    });
  }

  function hideAnswerKey() {
    Object.values(cardEls).forEach(function(el) {
      colorClasses.forEach(function(c) { el.classList.remove(c); });
    });
  }

  function toggleAnswerKey() {
    const btn = document.getElementById("answerKeyBtn");
    if (!keyVisible) {
      showAnswerKey();
      keyVisible = true;
      btn.textContent = "Hide answer key";
    } else {
      hideAnswerKey();
      keyVisible = false;
      btn.textContent = "Show answer key";
    }
  }

  document.getElementById("restartBtn").addEventListener("click", resetBoard);
  document.getElementById("nextWordBtn").addEventListener("click", nextWord);
  document.getElementById("sendShortBtn").addEventListener("click", function() { sendStaged("short"); });
  document.getElementById("sendLongBtn").addEventListener("click", function() { sendStaged("long"); });
  document.getElementById("answerKeyBtn").addEventListener("click", toggleAnswerKey);
  document.getElementById("clearColorBtn").addEventListener("click", function() { applyColorToSelected(null); });
  document.querySelectorAll(".swatch").forEach(function(btn) {
    btn.addEventListener("click", function() { applyColorToSelected(btn.getAttribute("data-color")); });
  });

  resetBoard();

  // ===================== SCREEN 2: SUFFIX PATTERNS =====================
  const DEF_PAIRS = [
    { s: "hop", l: "hope" },
    { s: "tap", l: "tape" },
    { s: "cop", l: "cope" },
    { s: "grip", l: "gripe" },
    { s: "stop", l: "vote" },
    { s: "scrap", l: "scrape" },
    { s: "wag", l: "wage" },
    { s: "pin", l: "pine" }
  ];
  const ED2 = new B5Edit({ key: "short-vowel-endings-pairs", title: "Suffix pairs", defaultName: "hop / hope pairs", buttonLabel: "⚙ Edit pairs",
    help: "Screen 2. Short word (doubles the last letter: hopping) and long word with silent e (drops the e: hoping).",
    columns: [{ key: "s", label: "Short word" }, { key: "l", label: "Long word (ends in e)" }],
    defaults: DEF_PAIRS, min: 1, onChange: function(){ location.reload(); } });
  ED2.button.style.bottom = "56px";
  const pairs = ED2.rows();

  let pairIndex = 0;

  function doubledForms(base) {
    // double final consonant
    const stem = base + base[base.length - 1];
    return stem + "<span class=\"double-hl\">ing</span> / " + stem + "<span class=\"double-hl\">ed</span>";
  }
  function longForms(base) {
    // drop the silent e
    const stem = base.slice(0, -1);
    return stem + "<span class=\"single-hl\">ing</span> / " + stem + "<span class=\"single-hl\">ed</span>";
  }

  function renderPair() {
    const p = pairs[pairIndex];
    document.getElementById("pairProgress").textContent = "Pair " + (pairIndex + 1) + " of " + pairs.length;
    document.getElementById("shortBase").textContent = p.s;
    document.getElementById("longBase").textContent = p.l;
    document.getElementById("shortForms").innerHTML = doubledForms(p.s);
    document.getElementById("longForms").innerHTML = longForms(p.l);
    document.getElementById("shortForms").classList.remove("show");
    document.getElementById("longForms").classList.remove("show");
  }

  document.getElementById("revealBtn").addEventListener("click", function() {
    document.getElementById("shortForms").classList.add("show");
    document.getElementById("longForms").classList.add("show");
  });
  document.getElementById("nextPairBtn").addEventListener("click", function() {
    if (pairIndex < pairs.length - 1) { pairIndex++; renderPair(); }
  });
  document.getElementById("prevPairBtn").addEventListener("click", function() {
    if (pairIndex > 0) { pairIndex--; renderPair(); }
  });

  renderPair();

  // ===================== TAB SWITCHING =====================
  document.getElementById("tabBtn1").addEventListener("click", function() {
    document.getElementById("screen1").classList.add("active");
    document.getElementById("screen2").classList.remove("active");
    document.getElementById("tabBtn1").classList.add("active");
    document.getElementById("tabBtn2").classList.remove("active");
  });
  document.getElementById("tabBtn2").addEventListener("click", function() {
    document.getElementById("screen2").classList.add("active");
    document.getElementById("screen1").classList.remove("active");
    document.getElementById("tabBtn2").classList.add("active");
    document.getElementById("tabBtn1").classList.remove("active");
  });
})();
</script>
</body>
