<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mystery Card: Questions with be</title>
<style>
  :root {
    --navy: #2F3C7E; --ink: #1F2A44; --gray: #8A93A8; --line: #C9CEDB; --bg: #EEF1F8; --paper: #FFFFFF;
    --am: #E4572E; --is: #1B998B; --are: #7B4FB8; --yes: #1B998B; --no: #C0392B; --gold: #F2B134;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: Calibri, "Segoe UI", Candara, "Trebuchet MS", sans-serif;
    background: var(--bg); color: var(--ink);
    display: grid; grid-template-rows: auto auto 1fr; gap: 1.6vh;
    padding: 2vh 2.2vw;
  }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* top bar */
  .top { display: flex; align-items: center; gap: 1.2vw; }
  .tabs { display: flex; gap: 0.6vw; }
  .tab {
    font-size: clamp(16px, 2.6vh, 30px); font-weight: 700; padding: 0.8vh 1.6vw;
    border: 2px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--ink);
  }
  .tab[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
  .spacer { flex: 1; }
  .count { font-size: clamp(14px, 2.4vh, 26px); color: var(--gray); }
  .count b { color: var(--ink); }
  .new {
    font-size: clamp(16px, 2.6vh, 30px); font-weight: 700; padding: 0.8vh 1.6vw;
    border: none; border-radius: 10px; background: var(--gold); color: var(--ink);
  }

  /* sentence frame */
  .frame {
    background: var(--paper); border-radius: 18px; border: 2px solid var(--line);
    display: grid; grid-template-columns: 1fr 1fr; gap: 1vw; padding: 1.8vh 2vw;
  }
  .frame .lab { font-size: clamp(13px, 2.1vh, 22px); color: var(--gray); margin-bottom: 0.4vh; }
  .q, .a { font-size: clamp(26px, 6vh, 68px); font-weight: 700; line-height: 1.15; }
  .blank {
    display: inline-block; min-width: 5ch; border-bottom: 0.5vh solid var(--ink);
    text-align: center; color: var(--navy);
  }
  .blank.filled { border-bottom-color: transparent; min-width: 0; }
  .be-are { color: var(--are); } .be-is { color: var(--is); } .be-am { color: var(--am); }
  .answers { display: flex; flex-direction: column; gap: 0.4vh; }
  .ans { opacity: 0.35; transition: opacity .2s; }
  .ans.on { opacity: 1; }
  .ans.yes.on { color: var(--yes); } .ans.no.on { color: var(--no); }
  .full { font-size: clamp(16px, 3vh, 34px); color: var(--ink); min-height: 1.3em; margin-top: 0.4vh; font-weight: 400; }

  /* board */
  .board { display: grid; grid-template-columns: minmax(0, 22vw) 1fr; gap: 1.6vw; min-height: 0; }
  .mystery {
    background: var(--navy); border-radius: 18px; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1vh;
    perspective: 800px; min-height: 0;
  }
  .mystery .who { font-size: clamp(16px, 3vh, 34px); opacity: 0.85; }
  .mystery .face { font-size: clamp(60px, 18vh, 200px); line-height: 1; }
  .mystery .qmark { font-size: clamp(40px, 10vh, 120px); font-weight: 700; color: var(--gold); line-height: 1; }
  .mystery .reveal { font-size: clamp(20px, 4.4vh, 50px); font-weight: 700; text-align: center; padding: 0 1vw; }
  .mystery .rpic { font-size: clamp(40px, 12vh, 130px); line-height: 1; white-space: nowrap; display: flex; gap: 0.1em; }
  .mystery .rpic svg { width: 1em; height: 1em; }
  .mystery .reveal span { color: #fff; text-decoration: underline; text-underline-offset: 0.15em; }
  .mystery.found { animation: flip .6s ease; background: var(--yes); }
  @keyframes flip { 0% { transform: rotateY(90deg); } 100% { transform: rotateY(0); } }
  @media (prefers-reduced-motion: reduce) { .mystery.found { animation: none; } }

  .grid { display: grid; gap: 1vw; min-height: 0; }
  .card {
    background: var(--paper); border: 2px solid var(--line); border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.6vh;
    min-height: 0; overflow: hidden; position: relative; color: var(--ink);
  }
  .card:hover { border-color: var(--navy); }
  .card .pic { font-size: clamp(30px, 8vh, 96px); line-height: 1; display: flex; gap: 0.2em; align-items: center; }
  .card .pic svg { width: 1em; height: 1em; }
  .card .word { font-size: clamp(16px, 3.4vh, 38px); font-weight: 700; text-align: center; padding: 0 0.4vw; line-height: 1.1; }
  .card.out { opacity: 0.3; border-style: dashed; }
  .card.out::after {
    content: "✗"; position: absolute; top: 0.4vh; right: 0.6vw;
    font-size: clamp(20px, 4vh, 44px); color: var(--no); font-weight: 700;
  }
  .card.hit { border-color: var(--yes); border-width: 4px; background: #E6F5F2; }
  .card:disabled { cursor: default; }
</style>
</head>
<body>

<div class="top">
  <div class="tabs" role="group" aria-label="Who are we asking about?">
    <button class="tab" data-mode="you">you</button>
    <button class="tab" data-mode="he">he</button>
    <button class="tab" data-mode="she">she</button>
    <button class="tab" data-mode="it">it</button>
    <button class="tab" data-mode="they">they</button>
  </div>
  <div class="spacer"></div>
  <div class="count">Questions: <b id="count">0</b></div>
  <button class="new" id="newBtn">New round</button>
</div>

<div class="frame">
  <div>
    <p class="lab">Ask</p>
    <p class="q" id="question"></p>
  </div>
  <div>
    <p class="lab">Answer</p>
    <div class="answers">
      <p class="a ans yes" id="yes"></p>
      <p class="a ans no" id="no"></p>
    </div>
    <p class="full" id="full"></p>
  </div>
</div>

<div class="board">
  <div class="mystery" id="mystery"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
(function () {
  const ERASER = '<svg viewBox="0 0 64 64" aria-hidden="true"><g transform="rotate(-25 32 32)"><rect x="6" y="20" width="52" height="24" rx="5" fill="#F4A6B8"/><rect x="34" y="20" width="24" height="24" rx="5" fill="#4A7BD0"/><rect x="34" y="20" width="6" height="24" fill="#4A7BD0"/></g></svg>';

  const people = [
    ["a teacher", "🧑‍🏫"], ["a student", "🧑‍🎓"], ["a parent", "👪"], ["a doctor", "🧑‍⚕️"],
    ["a nurse", "💉"], ["a cook", "🧑‍🍳"], ["a driver", "🚌"], ["a farmer", "🧑‍🌾"],
    ["a cashier", "🛒"], ["a mechanic", "🔧"], ["a police officer", "👮"], ["a firefighter", "🧑‍🚒"]
  ];
  const things = [
    ["a pencil", "pencils", "✏️"], ["a computer", "computers", "💻"], ["a piece of paper", "pieces of paper", "📄"],
    ["an eraser", "erasers", ERASER], ["a door", "doors", "🚪"], ["a window", "windows", "🪟"],
    ["a backpack", "backpacks", "🎒"], ["a wastebasket", "wastebaskets", "🗑️"],
    ["a book", "books", "📘"], ["a notebook", "notebooks", "📓"], ["a pen", "pens", "🖊️"], ["a chair", "chairs", "🪑"]
  ];

  // be-word colors match the class slides: am orange, is teal, are purple
  const modes = {
    you:  { set: "people", be: ["Are", "are"], subj: "you",  yes: 'Yes, I <span class="be-am">am</span>.', no: 'No, I<span class="be-am">\'m</span> not.',
            pos: w => 'I <span class="be-am">am</span> ' + w + '.', neg: w => 'I<span class="be-am">\'m</span> not ' + w + '.', face: "🙋", who: "Ask the teacher" },
    he:   { set: "people", be: ["Is", "is"], subj: "he", yes: 'Yes, he <span class="be-is">is</span>.', no: 'No, he <span class="be-is">isn\'t</span>.',
            pos: w => 'He <span class="be-is">is</span> ' + w + '.', neg: w => 'He <span class="be-is">isn\'t</span> ' + w + '.', face: "👨", who: "Who is he?" },
    she:  { set: "people", be: ["Is", "is"], subj: "she", yes: 'Yes, she <span class="be-is">is</span>.', no: 'No, she <span class="be-is">isn\'t</span>.',
            pos: w => 'She <span class="be-is">is</span> ' + w + '.', neg: w => 'She <span class="be-is">isn\'t</span> ' + w + '.', face: "👩", who: "Who is she?" },
    it:   { set: "one", be: ["Is", "is"], subj: "it", yes: 'Yes, it <span class="be-is">is</span>.', no: 'No, it <span class="be-is">isn\'t</span>.',
            pos: w => 'It <span class="be-is">is</span> ' + w + '.', neg: w => 'It <span class="be-is">isn\'t</span> ' + w + '.', face: "📦", who: "What is it?" },
    they: { set: "many", be: ["Are", "are"], subj: "they", yes: 'Yes, they <span class="be-are">are</span>.', no: 'No, they <span class="be-are">aren\'t</span>.',
            pos: w => 'They <span class="be-are">are</span> ' + w + '.', neg: w => 'They <span class="be-are">aren\'t</span> ' + w + '.', face: "📦📦", who: "What are they?" }
  };

  let mode = "you", items = [], secret = -1, count = 0, done = false;
  const $ = id => document.getElementById(id);

  function beClass(m) { return m.be[0] === "Are" ? "be-are" : "be-is"; }

  function itemsFor(m) {
    if (m.set === "people") return people.map(p => ({ word: p[0], pic: p[1] }));
    if (m.set === "one") return things.map(t => ({ word: t[0], pic: t[2] }));
    return things.map(t => ({ word: t[1], pic: t[2] + t[2] }));
  }

  function setQuestion(word) {
    const m = modes[mode];
    const blank = word
      ? '<span class="blank filled">' + word + '</span>'
      : '<span class="blank">&nbsp;</span>';
    $("question").innerHTML = '<span class="' + beClass(m) + '">' + m.be[0] + '</span> ' + m.subj + ' ' + blank + '?';
  }

  function setAnswer(which, fullHTML) {
    $("yes").classList.toggle("on", which === "yes");
    $("no").classList.toggle("on", which === "no");
    $("full").innerHTML = fullHTML || "";
  }

  function renderMystery() {
    const m = modes[mode], el = $("mystery");
    el.classList.remove("found");
    el.innerHTML = '<p class="who">' + m.who + '</p><p class="face">' + m.face + '</p><p class="qmark">?</p>';
  }

  function newRound() {
    const m = modes[mode];
    items = itemsFor(m);
    secret = Math.floor(Math.random() * items.length);
    count = 0; done = false;
    $("count").textContent = "0";
    $("yes").innerHTML = m.yes;
    $("no").innerHTML = m.no;
    setQuestion(null);
    setAnswer(null);
    renderMystery();

    const grid = $("grid");
    const cols = items.length > 8 ? 4 : 4;
    grid.style.gridTemplateColumns = "repeat(" + cols + ", minmax(0, 1fr))";
    grid.style.gridTemplateRows = "repeat(" + Math.ceil(items.length / cols) + ", minmax(0, 1fr))";
    grid.innerHTML = "";
    items.forEach((it, i) => {
      const b = document.createElement("button");
      b.className = "card";
      b.innerHTML = '<span class="pic">' + it.pic + '</span><span class="word">' + it.word + '</span>';
      b.setAttribute("aria-label", it.word);
      b.addEventListener("click", () => ask(i, b));
      grid.appendChild(b);
    });
  }

  function ask(i, btn) {
    if (done || btn.classList.contains("out")) return;
    const m = modes[mode], w = items[i].word;
    count++; $("count").textContent = count;
    setQuestion(w);
    if (i === secret) {
      done = true;
      btn.classList.add("hit");
      setAnswer("yes", m.pos(w));
      const el = $("mystery");
      el.classList.add("found");
      el.innerHTML = '<p class="rpic">' + items[i].pic + '</p><p class="reveal">' + m.pos(w) + '</p>';
      document.querySelectorAll(".card").forEach(c => { c.disabled = true; });
    } else {
      btn.classList.add("out");
      btn.disabled = true;
      setAnswer("no", m.neg(w));
    }
  }

  document.querySelectorAll(".tab").forEach(t => {
    t.addEventListener("click", () => {
      mode = t.dataset.mode;
      document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-pressed", x === t ? "true" : "false"));
      newRound();
    });
  });
  $("newBtn").addEventListener("click", newRound);

  document.querySelector('.tab[data-mode="you"]').setAttribute("aria-pressed", "true");
  document.querySelectorAll('.tab:not([data-mode="you"])').forEach(x => x.setAttribute("aria-pressed", "false"));
  newRound();
})();
</script>
</body>
</html>
