<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Vowel Sound Hunt</title>
<style>
  :root {
    --bg: #f5f5f0;
    --ink: #2c2c2a;
    --sub: #6a6862;
    --line: rgba(0,0,0,0.14);
    --card: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
  }
  body {
    display: flex;
    flex-direction: column;
    padding: 2vh 3vw;
  }
  header {
    text-align: center;
    margin-bottom: 1.4vh;
  }
  h1 {
    font-size: 3.2vh;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .subtitle {
    font-size: 1.7vh;
    color: var(--sub);
    margin-top: 0.4vh;
  }
  .progress {
    text-align: center;
    font-size: 1.6vh;
    color: var(--sub);
    margin-bottom: 1.4vh;
  }
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.6vh;
    min-height: 0;
  }
  .sentence-card {
    background: var(--card);
    border: 0.5px solid var(--line);
    border-radius: 18px;
    padding: 4vh 4vw;
    width: 100%;
    max-width: 1200px;
    box-shadow: 0 2px 18px rgba(0,0,0,0.05);
  }
  .sentence {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-end;
    row-gap: 1.6vh;
    column-gap: 0.9vw;
  }
  .word-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5vh;
  }
  .ipa-tag {
    font-size: 1.3vh;
    color: var(--sub);
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    white-space: nowrap;
  }
  .ipa-tag.show { opacity: 1; transform: translateY(0); }
  .word {
    font-size: 3.4vh;
    font-weight: 500;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.3vh 0.7vh;
    border-radius: 8px;
    color: var(--ink);
    transition: background 0.25s ease, color 0.25s ease, transform 0.15s ease;
    font-family: inherit;
  }
  .word:hover { background: rgba(0,0,0,0.06); }
  .word:active { transform: scale(0.96); }
  .word.revealed {
    color: var(--wordfg, #fff);
    background: var(--wordbg, #444);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
  }
  .word.schwa {
    color: var(--sub);
    background: repeating-linear-gradient(45deg, rgba(0,0,0,0.03), rgba(0,0,0,0.03) 6px, transparent 6px, transparent 12px);
    font-style: italic;
    box-shadow: inset 0 0 0 1.5px rgba(0,0,0,0.15);
  }
  .word.target-hit {
    animation: pop 0.35s ease;
  }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.14); }
    100% { transform: scale(1); }
  }
  .hunt-panel {
    background: var(--card);
    border: 0.5px solid var(--line);
    border-radius: 14px;
    padding: 1.8vh 3vw;
    width: 100%;
    max-width: 900px;
    text-align: center;
    min-height: 8vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hunt-pre {
    font-size: 2vh;
    color: var(--sub);
  }
  .hunt-pre b { color: var(--ink); }
  .hunt-reveal {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 1.4vw;
    flex-wrap: wrap;
  }
  .hunt-reveal.show { display: flex; }
  .swatch {
    width: 4vh;
    height: 4vh;
    border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
    flex-shrink: 0;
  }
  .hunt-reveal .label {
    font-size: 2.4vh;
    font-weight: 600;
  }
  .hunt-reveal .ipa {
    font-size: 2.2vh;
    color: var(--sub);
  }
  .hunt-reveal .count {
    font-size: 2.2vh;
    font-weight: 600;
    color: var(--ink);
    background: rgba(0,0,0,0.06);
    padding: 0.4vh 1.4vh;
    border-radius: 999px;
  }
  .hunt-reveal.done .count {
    background: #2f6b44;
    color: white;
  }
  .controls {
    display: flex;
    gap: 1vw;
    justify-content: center;
    align-items: center;
    margin-top: 1.6vh;
    flex-wrap: wrap;
  }
  button.ctrl {
    font-family: inherit;
    font-size: 1.8vh;
    padding: 1.1vh 2.2vw;
    background: white;
    color: var(--ink);
    border: 0.5px solid rgba(0,0,0,0.3);
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button.ctrl:hover { background: #ececE4; }
  button.ctrl.primary {
    background: var(--ink);
    color: white;
    border-color: var(--ink);
  }
  button.ctrl.primary:hover { background: #444441; }
  button.ctrl:disabled { opacity: 0.35; cursor: default; }
  .dots {
    display: flex;
    gap: 0.5vw;
    justify-content: center;
    margin-top: 1vh;
  }
  .dot {
    width: 0.9vh;
    height: 0.9vh;
    border-radius: 50%;
    background: rgba(0,0,0,0.18);
  }
  .dot.active { background: var(--ink); }

  .fs-btn {
    position: absolute;
    top: 2vh;
    right: 2vw;
    font-size: 1.6vh;
    padding: 0.9vh 1.6vw;
    background: white;
    color: var(--ink);
    border: 0.5px solid rgba(0,0,0,0.3);
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
  }
  .fs-btn:hover { background: #ececE4; }

  .stage-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.6vh;
    width: 100%;
    min-height: 0;
    animation: fadeIn 0.35s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Title & closing slides */
  .title-slide, .closing-slide {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.4vh;
    text-align: center;
    width: 100%;
  }
  .title-slide .big {
    font-size: 5vh;
    font-weight: 700;
  }
  .title-slide .tag {
    font-size: 2.1vh;
    color: var(--sub);
    max-width: 700px;
    line-height: 1.5;
  }
  .title-slide .hint {
    font-size: 1.8vh;
    color: var(--sub);
    font-style: italic;
    margin-top: 1vh;
  }
  .recap-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1.2vh 1.4vw;
    width: 100%;
    max-width: 1100px;
  }
  .recap-chip {
    display: flex;
    align-items: center;
    gap: 0.8vw;
    background: var(--card);
    border: 0.5px solid var(--line);
    border-radius: 10px;
    padding: 1vh 1vw;
  }
  .recap-chip .dot-swatch {
    width: 2.6vh;
    height: 2.6vh;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
  }
  .recap-chip .txt {
    text-align: left;
    line-height: 1.2;
  }
  .recap-chip .txt .nm { font-size: 1.6vh; font-weight: 600; }
  .recap-chip .txt .ip { font-size: 1.4vh; color: var(--sub); }
</style>
</head>
<body>

<button class="fs-btn" id="fsBtn">⛶ Fullscreen</button>

<header>
  <h1>Color Vowel Sound Hunt</h1>
  <div class="subtitle">Click any word to reveal its Color Vowel sound. Find every word that shares the hidden target color!</div>
</header>

<div class="progress" id="progress">Sentence 1 of 16</div>

<div class="stage">
  <div class="stage-inner" id="stageInner">
    <div class="sentence-card" id="sentenceCard">
      <div class="sentence" id="sentence"></div>
    </div>

    <div class="hunt-panel" id="huntPanel">
      <div class="hunt-pre" id="huntPre"></div>
      <div class="hunt-reveal" id="huntReveal">
        <div class="swatch" id="swatch"></div>
        <div class="label" id="revealLabel"></div>
        <div class="ipa" id="revealIpa"></div>
        <div class="count" id="revealCount"></div>
      </div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="ctrl" id="prevBtn">← Prev</button>
  <button class="ctrl" id="resetBtn">Reset sentence</button>
  <button class="ctrl primary" id="nextBtn">Next →</button>
</div>
<div class="dots" id="dots"></div>

<script>
/* B5 content editor — shared by the Classroom-Games suite.
   Saved per browser in localStorage. Supports several named lists,
   a table editor, a "paste many" text box, and Reset to defaults. */
(function () {
  var CSS = '' +
  '.b5e-btn{position:fixed;right:12px;bottom:12px;z-index:9000;font:600 14px/1 -apple-system,"Segoe UI",sans-serif;background:#fff;color:#2c2c2a;border:1px solid rgba(0,0,0,.25);border-radius:20px;padding:9px 14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12);opacity:.85}' +
  '.b5e-btn:hover{opacity:1}' +
  '.b5e-ov{position:fixed;inset:0;z-index:9500;background:rgba(20,20,18,.55);display:none;align-items:center;justify-content:center;font:15px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;color:#2c2c2a}' +
  '.b5e-ov.open{display:flex}' +
  '.b5e-box{background:#fff;border-radius:14px;width:min(1000px,96vw);height:min(760px,94vh);display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.3)}' +
  '.b5e-head{padding:14px 18px 10px;border-bottom:1px solid #e6e4dd}' +
  '.b5e-head h2{font-size:20px;font-weight:600;margin:0 0 8px}' +
  '.b5e-lists{display:flex;flex-wrap:wrap;gap:6px;align-items:center}' +
  '.b5e-lists select,.b5e-lists input{font:inherit;padding:5px 8px;border:1px solid #c9c6bd;border-radius:6px}' +
  '.b5e-lists input{width:220px}' +
  '.b5e-help{font-size:13px;color:#66645e;margin-top:6px}' +
  '.b5e-body{flex:1;overflow:auto;padding:10px 18px}' +
  '.b5e-set{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:10px;padding:8px 10px;background:#f6f5f0;border-radius:8px}' +
  '.b5e-set label{font-size:13px;display:flex;gap:6px;align-items:center}' +
  '.b5e-set input,.b5e-set select{font:inherit;padding:3px 6px;border:1px solid #c9c6bd;border-radius:5px}' +
  '.b5e-tbl{width:100%;border-collapse:collapse}' +
  '.b5e-tbl th{text-align:left;font-size:12px;letter-spacing:.5px;color:#66645e;padding:4px;position:sticky;top:-10px;background:#fff}' +
  '.b5e-tbl td{padding:3px 4px;vertical-align:top}' +
  '.b5e-tbl td.n{color:#99968e;font-size:12px;width:26px;padding-top:9px}' +
  '.b5e-tbl input,.b5e-tbl select,.b5e-tbl textarea{width:100%;font:inherit;padding:5px 7px;border:1px solid #d4d1c8;border-radius:5px;background:#fff}' +
  '.b5e-tbl textarea{min-height:34px;resize:vertical}' +
  '.b5e-x{border:none;background:none;color:#a33;font-size:18px;cursor:pointer;padding:4px 6px}' +
  '.b5e-act{font:inherit;font-size:12px;padding:5px 8px;border:1px solid #c9c6bd;border-radius:5px;background:#f6f5f0;cursor:pointer;white-space:nowrap}' +
  '.b5e-bulk{width:100%;height:100%;min-height:360px;font:14px/1.5 ui-monospace,Consolas,monospace;padding:10px;border:1px solid #c9c6bd;border-radius:8px}' +
  '.b5e-foot{padding:10px 18px;border-top:1px solid #e6e4dd;display:flex;flex-wrap:wrap;gap:8px;align-items:center}' +
  '.b5e-foot .sp{flex:1}' +
  '.b5e-b{font:inherit;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid #c9c6bd;background:#fff;cursor:pointer}' +
  '.b5e-b.pri{background:#1a5fa8;border-color:#1a5fa8;color:#fff;font-weight:600}' +
  '.b5e-b.warn{color:#a33}' +
  '.b5e-msg{font-size:13px;color:#a33;min-height:18px}' +
  '.b5e-msg.ok{color:#1a6b3a}';

  function el(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'text') e.textContent = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  function clone(x) { return JSON.parse(JSON.stringify(x)); }

  function B5Edit(cfg) {
    var self = this;
    this.cfg = cfg;
    this.cols = cfg.columns;
    this.key = 'b5edit:' + cfg.key;
    this.defaultName = cfg.defaultName || 'Default list';
    this.listeners = [];
    if (cfg.onChange) this.listeners.push(cfg.onChange);
    this.state = this._load();
    if (!document.getElementById('b5e-css')) {
      var st = el('style', { id: 'b5e-css' }); st.textContent = CSS; document.head.appendChild(st);
    }
    this._build();
    if (cfg.button !== false) {
      var host = cfg.buttonHost ? (typeof cfg.buttonHost === 'string' ? document.querySelector(cfg.buttonHost) : cfg.buttonHost) : null;
      var b = el('button', { 'class': host ? (cfg.buttonClass || '') : 'b5e-btn', type: 'button', text: cfg.buttonLabel || '⚙ Edit content', onclick: function () { self.open(); } });
      if (host) host.appendChild(b); else document.body.appendChild(b);
      this.button = b;
    }
  }

  B5Edit.prototype._defaults = function () {
    var s = {};
    (this.cfg.settings || []).forEach(function (f) { s[f.key] = f.default; });
    return { v: 1, current: 'default', settings: s,
      lists: [{ id: 'default', name: this.defaultName, rows: clone(this.cfg.defaults) }] };
  };
  B5Edit.prototype._load = function () {
    var d = this._defaults();
    try {
      var raw = localStorage.getItem(this.key);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && Array.isArray(s.lists) && s.lists.length) {
          s.settings = Object.assign({}, d.settings, s.settings || {});
          if (!s.lists.some(function (l) { return l.id === s.current; })) s.current = s.lists[0].id;
          return s;
        }
      }
    } catch (e) {}
    return d;
  };
  B5Edit.prototype._save = function () {
    try { localStorage.setItem(this.key, JSON.stringify(this.state)); } catch (e) {}
  };
  B5Edit.prototype._cur = function () {
    var st = this.state;
    return st.lists.filter(function (l) { return l.id === st.current; })[0] || st.lists[0];
  };
  /* public API */
  B5Edit.prototype.rows = function () { return clone(this._cur().rows); };
  B5Edit.prototype.listName = function () { return this._cur().name; };
  B5Edit.prototype.settings = function () { return clone(this.state.settings); };
  B5Edit.prototype.onChange = function (fn) { this.listeners.push(fn); };
  B5Edit.prototype.listNames = function () { return this.state.lists.map(function (l) { return { id: l.id, name: l.name }; }); };
  B5Edit.prototype.useList = function (id) {
    if (this.state.lists.some(function (l) { return l.id === id; })) { this.state.current = id; this._save(); this._fire(); }
  };
  B5Edit.prototype._fire = function () {
    var self = this;
    this.listeners.forEach(function (fn) { try { fn(self.rows(), self.settings(), self.listName()); } catch (e) { console.error(e); } });
  };

  /* ---------- UI ---------- */
  B5Edit.prototype._build = function () {
    var self = this, cfg = this.cfg;
    this.ov = el('div', { 'class': 'b5e-ov' });
    this.sel = el('select', { onchange: function () { self._pull(); self.work.current = self.sel.value; self._render(); } });
    this.nameIn = el('input', { placeholder: 'List name', oninput: function () { self._curW().name = self.nameIn.value; self._fillSel(); } });
    var lists = el('div', { 'class': 'b5e-lists' }, [
      el('span', { text: 'List:' }), this.sel, this.nameIn,
      el('button', { 'class': 'b5e-act', type: 'button', text: '+ New list', onclick: function () { self._newList(false); } }),
      el('button', { 'class': 'b5e-act', type: 'button', text: 'Copy list', onclick: function () { self._newList(true); } }),
      el('button', { 'class': 'b5e-act', type: 'button', text: 'Delete list', onclick: function () { self._delList(); } })
    ]);
    var help = el('div', { 'class': 'b5e-help', html: cfg.help || '' });
    this.body = el('div', { 'class': 'b5e-body' });
    this.msg = el('div', { 'class': 'b5e-msg' });
    this.bulkBtn = el('button', { 'class': 'b5e-b', type: 'button', text: 'Paste many', onclick: function () { self._toggleBulk(); } });
    var foot = el('div', { 'class': 'b5e-foot' }, [
      el('button', { 'class': 'b5e-b', type: 'button', text: '+ Add row', onclick: function () { self._pull(); self._curW().rows.push(self._blank()); self._render(); self.body.scrollTop = 1e6; } }),
      this.bulkBtn,
      el('button', { 'class': 'b5e-b warn', type: 'button', text: 'Reset to defaults', onclick: function () { self._reset(); } }),
      el('div', { 'class': 'sp' }, [this.msg]),
      el('button', { 'class': 'b5e-b', type: 'button', text: 'Cancel', onclick: function () { self.close(); } }),
      el('button', { 'class': 'b5e-b pri', type: 'button', text: 'Save', onclick: function () { self._commit(); } })
    ]);
    this.box = el('div', { 'class': 'b5e-box' }, [
      el('div', { 'class': 'b5e-head' }, [el('h2', { text: cfg.title || 'Edit content' }), lists, help]),
      this.body, foot
    ]);
    this.ov.appendChild(this.box);
    this.ov.addEventListener('keydown', function (e) { e.stopPropagation(); if (e.key === 'Escape') self.close(); });
    this.ov.addEventListener('keyup', function (e) { e.stopPropagation(); });
    this.ov.addEventListener('keypress', function (e) { e.stopPropagation(); });
    document.body.appendChild(this.ov);
  };
  B5Edit.prototype._blank = function () { var r = {}; this.cols.forEach(function (c) { r[c.key] = c.options ? c.options[0].value !== undefined ? c.options[0].value : c.options[0] : ''; }); return r; };
  B5Edit.prototype._curW = function () { var w = this.work; return w.lists.filter(function (l) { return l.id === w.current; })[0]; };
  B5Edit.prototype._fillSel = function () {
    var w = this.work, sel = this.sel; sel.innerHTML = '';
    w.lists.forEach(function (l) { sel.appendChild(el('option', { value: l.id, text: l.name || '(no name)' })); });
    sel.value = w.current;
  };
  B5Edit.prototype.open = function () {
    this.work = clone(this.state); this.bulk = false; this.bulkBtn.textContent = 'Paste many';
    this.msg.textContent = ''; this._render(); this.ov.classList.add('open');
    if (this.cfg.onOpen) this.cfg.onOpen();
  };
  B5Edit.prototype.close = function () { this.ov.classList.remove('open'); if (this.cfg.onClose) this.cfg.onClose(); };
  B5Edit.prototype._optVal = function (o) { return o && o.value !== undefined ? o.value : o; };
  B5Edit.prototype._render = function () {
    var self = this, cfg = this.cfg, L = this._curW();
    this._fillSel(); this.nameIn.value = L.name;
    this.body.innerHTML = '';
    if ((cfg.settings || []).length) {
      var set = el('div', { 'class': 'b5e-set' });
      cfg.settings.forEach(function (f) {
        var v = self.work.settings[f.key], inp;
        if (f.type === 'select') {
          inp = el('select', { 'data-k': f.key });
          f.options.forEach(function (o) { inp.appendChild(el('option', { value: String(self._optVal(o)), text: o.label || String(o) })); });
          inp.value = String(v);
        } else if (f.type === 'checkbox') {
          inp = el('input', { type: 'checkbox', 'data-k': f.key }); inp.checked = !!v;
        } else {
          inp = el('input', { type: f.type || 'text', 'data-k': f.key, value: v == null ? '' : v, style: 'width:' + (f.width || 90) + 'px' });
          if (f.min != null) inp.min = f.min; if (f.max != null) inp.max = f.max;
        }
        set.appendChild(el('label', {}, [el('span', { text: f.label }), inp]));
      });
      this.body.appendChild(set);
      this.setBox = set;
    } else this.setBox = null;
    if (this.bulk) {
      var fmt = this.cols.map(function (c) { return c.label; }).join(' | ');
      this.body.appendChild(el('div', { 'class': 'b5e-help', text: 'One row per line. ' + (this.cols.length > 1 ? 'Separate the boxes with | like this:  ' + fmt : '') }));
      this.ta = el('textarea', { 'class': 'b5e-bulk' });
      this.ta.value = L.rows.map(function (r) { return self.cols.map(function (c) { return r[c.key] == null ? '' : String(r[c.key]); }).join(' | '); }).join('\n');
      this.body.appendChild(this.ta);
      return;
    }
    var tbl = el('table', { 'class': 'b5e-tbl' });
    var hr = el('tr', {}, [el('th', { text: '#' })]);
    this.cols.forEach(function (c) { hr.appendChild(el('th', { text: c.label, style: c.width ? 'width:' + c.width : '' })); });
    if (cfg.rowAction) hr.appendChild(el('th'));
    hr.appendChild(el('th'));
    tbl.appendChild(hr);
    L.rows.forEach(function (r, i) {
      var tr = el('tr', {}, [el('td', { 'class': 'n', text: String(i + 1) })]);
      self.cols.forEach(function (c) {
        var inp, v = r[c.key] == null ? '' : r[c.key];
        if (c.options) {
          inp = el('select');
          c.options.forEach(function (o) { inp.appendChild(el('option', { value: String(self._optVal(o)), text: o.label || String(o) })); });
          inp.value = String(v);
        } else if (c.multiline) { inp = el('textarea', { placeholder: c.placeholder || '' }); inp.value = v; }
        else inp = el('input', { value: v, placeholder: c.placeholder || '' });
        inp.setAttribute('data-k', c.key);
        tr.appendChild(el('td', {}, [inp]));
      });
      if (cfg.rowAction) tr.appendChild(el('td', {}, [el('button', { 'class': 'b5e-act', type: 'button', text: cfg.rowAction.label, onclick: function () { self._rowAct(i); } })]));
      tr.appendChild(el('td', {}, [el('button', { 'class': 'b5e-x', type: 'button', title: 'Delete row', text: '×', onclick: function () { self._pull(); self._curW().rows.splice(i, 1); self._render(); } })]));
      tbl.appendChild(tr);
    });
    this.body.appendChild(tbl);
    this.tbl = tbl;
  };
  B5Edit.prototype._pull = function () {
    var self = this, L = this._curW();
    if (!L) return;
    if (this.setBox) {
      [].forEach.call(this.setBox.querySelectorAll('[data-k]'), function (inp) {
        var k = inp.getAttribute('data-k'), f = self.cfg.settings.filter(function (s) { return s.key === k; })[0];
        var v = inp.type === 'checkbox' ? inp.checked : inp.value;
        if (f && (f.type === 'number' || typeof f.default === 'number') && inp.type !== 'checkbox') v = Number(v);
        self.work.settings[k] = v;
      });
    }
    if (this.bulk) {
      L.rows = this.ta.value.split('\n').map(function (line) { return line.trim(); }).filter(Boolean).map(function (line) {
        var parts = self.cols.length > 1 ? line.split('|') : [line], r = {};
        self.cols.forEach(function (c, i) { r[c.key] = (parts[i] || '').trim(); });
        return r;
      });
      return;
    }
    var trs = this.tbl ? this.tbl.querySelectorAll('tr') : [];
    var rows = [];
    for (var i = 1; i < trs.length; i++) {
      var r = {};
      [].forEach.call(trs[i].querySelectorAll('[data-k]'), function (inp) { r[inp.getAttribute('data-k')] = inp.value.trim(); });
      rows.push(r);
    }
    L.rows = rows;
  };
  B5Edit.prototype._toggleBulk = function () {
    this._pull(); this.bulk = !this.bulk;
    this.bulkBtn.textContent = this.bulk ? 'Table view' : 'Paste many';
    this._render();
  };
  B5Edit.prototype._newList = function (copy) {
    this._pull();
    var cur = this._curW(), id = 'l' + Date.now();
    var L = { id: id, name: copy ? cur.name + ' (copy)' : 'New list', rows: copy ? clone(cur.rows) : [this._blank()] };
    this.work.lists.push(L); this.work.current = id; this._render(); this.nameIn.focus(); this.nameIn.select();
  };
  B5Edit.prototype._delList = function () {
    if (this.work.lists.length < 2) { this._say('You need at least one list.'); return; }
    if (!confirm('Delete the list "' + this._curW().name + '"?')) return;
    var w = this.work; w.lists = w.lists.filter(function (l) { return l.id !== w.current; });
    w.current = w.lists[0].id; this._render();
  };
  B5Edit.prototype._reset = function () {
    if (!confirm('Bring back the original list and settings? Your other lists stay.')) return;
    var d = this._defaults(), w = this.work;
    var has = w.lists.filter(function (l) { return l.id === 'default'; })[0];
    if (has) { has.rows = d.lists[0].rows; has.name = d.lists[0].name; } else w.lists.unshift(d.lists[0]);
    w.settings = d.settings; w.current = 'default'; this._render(); this._say('Defaults restored. Press Save to use them.', true);
  };
  B5Edit.prototype._rowAct = function (i) {
    var self = this; this._pull();
    var L = this._curW(), r = L.rows[i];
    this._say('Working…', true);
    Promise.resolve(this.cfg.rowAction.run(clone(r))).then(function (nr) {
      if (nr) { L.rows[i] = nr; self._render(); }
      self._say('', true);
    }).catch(function (e) { self._say(String(e && e.message || e)); });
  };
  B5Edit.prototype._say = function (t, ok) { this.msg.textContent = t; this.msg.className = 'b5e-msg' + (ok ? ' ok' : ''); };
  B5Edit.prototype._commit = function () {
    this._pull();
    var self = this, w = this.work;
    // drop fully empty rows
    w.lists.forEach(function (L) {
      L.rows = L.rows.filter(function (r) { return self.cols.some(function (c) { return !c.options && String(r[c.key] || '').trim() !== ''; }) || self.cols.every(function (c) { return c.options; }); });
      if (self.cfg.clean) L.rows = L.rows.map(self.cfg.clean);
      if (!L.name) L.name = 'Untitled list';
    });
    var L = this._curW();
    var err = this.cfg.validate ? this.cfg.validate(L.rows, w.settings) : '';
    if (!err && this.cfg.min && L.rows.length < this.cfg.min) err = 'This list needs at least ' + this.cfg.min + ' rows.';
    if (err) { this._say(err); this._render(); return; }
    this.state = w; this._save(); this.close(); this._fire();
  };

  window.B5Edit = B5Edit;
})();

</script>
<script>
(function () {
  const COLOR_INFO = {
    BLACK:     { name: "Black",     keyword: "cat",   ipa: "/\u00e6/",  bg: "#2c2c2a", fg: "#ffffff" },
    RED:       { name: "Red",       keyword: "bed",   ipa: "/\u025b/",  bg: "#B5433D", fg: "#ffffff" },
    SILVER:    { name: "Silver",    keyword: "pin",   ipa: "/\u026a/",  bg: "#AEB7C2", fg: "#2c2c2a" },
    OLIVE:     { name: "Olive",     keyword: "sock",  ipa: "/\u0251/",  bg: "#7D7F3E", fg: "#ffffff" },
    MUSTARD:   { name: "Mustard",   keyword: "cup",   ipa: "/\u028c/",  bg: "#C08A2E", fg: "#ffffff" },
    GRAY:      { name: "Gray",      keyword: "day",   ipa: "/e\u026a/", bg: "#8A8677", fg: "#ffffff" },
    GREEN:     { name: "Green",     keyword: "tea",   ipa: "/i/",       bg: "#3F7D53", fg: "#ffffff" },
    WHITE:     { name: "White",     keyword: "tie",   ipa: "/a\u026a/", bg: "#F2F0E9", fg: "#2c2c2a" },
    ROSE:      { name: "Rose",      keyword: "boat",  ipa: "/o\u028a/", bg: "#B76E79", fg: "#ffffff" },
    BLUE:      { name: "Blue",      keyword: "moon",  ipa: "/u/",       bg: "#3A6EA5", fg: "#ffffff" },
    WOODEN:    { name: "Wooden",    keyword: "hook",  ipa: "/\u028a/",  bg: "#A9866B", fg: "#ffffff" },
    PURPLE:    { name: "Purple",    keyword: "shirt", ipa: "/\u025cr/", bg: "#6B4C7A", fg: "#ffffff" },
    ORANGE:    { name: "Orange",    keyword: "door",  ipa: "/\u0254r/", bg: "#C1602E", fg: "#ffffff" },
    AUBURN:    { name: "Auburn",    keyword: "dog",   ipa: "/\u0254/",  bg: "#8B3A2B", fg: "#ffffff" },
    TURQUOISE: { name: "Turquoise", keyword: "toy",   ipa: "/\u0254\u026a/", bg: "#2E8B84", fg: "#ffffff" },
    BROWN:     { name: "Brown",     keyword: "cow",   ipa: "/a\u028a/", bg: "#6B4226", fg: "#ffffff" },
    SCHWA:     { name: "Schwa \u2014 unstressed", keyword: "a", ipa: "/\u0259/", bg: "none", fg: "" },
  };

  const DEF_SLIDES = [
    { target: "BLACK", words: [["The","SCHWA"],["black","BLACK"],["cat","BLACK"],["sat","BLACK"],["on","OLIVE"],["the","SCHWA"],["flat","BLACK"],["mat","BLACK"],["and","BLACK"],["had","BLACK"],["a","SCHWA"],["snack.","BLACK"]] },
    { target: "RED", words: [["Fred","RED"],["said","RED"],["he","GREEN"],["read","RED"],["the","SCHWA"],["red","RED"],["letter","RED"],["while","WHITE"],["eating","GREEN"],["bread","RED"],["in","SILVER"],["bed.","RED"]] },
    { target: "SILVER", words: [["Jim","SILVER"],["was","MUSTARD"],["busy","SILVER"],["fixing","SILVER"],["the","SCHWA"],["big","SILVER"],["gym","SILVER"],["in","SILVER"],["the","SCHWA"],["village.","SILVER"]] },
    { target: "OLIVE", words: [["I","WHITE"],["want","OLIVE"],["to","BLUE"],["wash","OLIVE"],["my","WHITE"],["watch","OLIVE"],["and","BLACK"],["find","WHITE"],["my","WHITE"],["lost","OLIVE"],["socks.","OLIVE"]] },
    { target: "MUSTARD", words: [["My","WHITE"],["mother","MUSTARD"],["loves","MUSTARD"],["her","PURPLE"],["young","MUSTARD"],["cousins,","MUSTARD"],["who","BLUE"],["always","AUBURN"],["touch","MUSTARD"],["the","SCHWA"],["mustard","MUSTARD"],["cup.","MUSTARD"]] },
    { target: "GRAY", words: [["Today,","GRAY"],["eight","GRAY"],["friends","RED"],["ate","GRAY"],["cake","GRAY"],["and","BLACK"],["played","GRAY"],["in","SILVER"],["the","SCHWA"],["rain.","GRAY"]] },
    { target: "GREEN", words: [["We","GREEN"],["could","WOODEN"],["see","GREEN"],["the","SCHWA"],["green","GREEN"],["tea","GREEN"],["leaves","GREEN"],["and","BLACK"],["believe","GREEN"],["the","SCHWA"],["lucky","MUSTARD"],["find.","WHITE"]] },
    { target: "WHITE", words: [["I","WHITE"],["tried","WHITE"],["to","BLUE"],["buy","WHITE"],["a","SCHWA"],["slice","WHITE"],["of","SCHWA"],["pie","WHITE"],["before","ORANGE"],["night,","WHITE"],["but","MUSTARD"],["my","WHITE"],["eyes","WHITE"],["were","PURPLE"],["tired.","WHITE"]] },
    { target: "ROSE", words: [["I","WHITE"],["know","ROSE"],["we","GREEN"],["should","WOODEN"],["row","ROSE"],["the","SCHWA"],["boat","ROSE"],["home","ROSE"],["before","ORANGE"],["the","SCHWA"],["snow","ROSE"],["falls,","AUBURN"],["though","ROSE"],["it's","SILVER"],["slow","ROSE"],["going.","ROSE"]] },
    { target: "BLUE", words: [["In","SILVER"],["June,","BLUE"],["we","GREEN"],["grew","BLUE"],["fresh","RED"],["fruit","BLUE"],["and","BLACK"],["made","GRAY"],["juice","BLUE"],["to","BLUE"],["eat","GREEN"],["with","SILVER"],["soup","BLUE"],["and","BLACK"],["noodles.","BLUE"]] },
    { target: "WOODEN", words: [["She","GREEN"],["could","WOODEN"],["put","WOODEN"],["the","SCHWA"],["book","WOODEN"],["on","OLIVE"],["the","SCHWA"],["wooden","WOODEN"],["shelf","RED"],["and","BLACK"],["pull","WOODEN"],["her","PURPLE"],["foot","WOODEN"],["back.","BLACK"]] },
    { target: "PURPLE", words: [["The","SCHWA"],["girl","PURPLE"],["in","SILVER"],["the","SCHWA"],["purple","PURPLE"],["shirt","PURPLE"],["heard","PURPLE"],["her","PURPLE"],["friend's","RED"],["bird","PURPLE"],["chirp","PURPLE"],["as","BLACK"],["she","GREEN"],["learned","PURPLE"],["about","BROWN"],["the","SCHWA"],["earth.","PURPLE"]] },
    { target: "ORANGE", words: [["Before","ORANGE"],["we","GREEN"],["opened","ROSE"],["the","SCHWA"],["door,","ORANGE"],["four","ORANGE"],["more","ORANGE"],["people","GREEN"],["poured","ORANGE"],["water","AUBURN"],["on","OLIVE"],["the","SCHWA"],["board.","ORANGE"]] },
    { target: "AUBURN", words: [["The","SCHWA"],["dog","AUBURN"],["chased","GRAY"],["a","SCHWA"],["ball","AUBURN"],["across","AUBURN"],["the","SCHWA"],["grass","BLACK"],["but","MUSTARD"],["paused","AUBURN"],["to","BLUE"],["sniff","SILVER"],["the","SCHWA"],["sauce","AUBURN"],["someone","MUSTARD"],["had","BLACK"],["dropped.","OLIVE"]] },
    { target: "TURQUOISE", words: [["The","SCHWA"],["boy","TURQUOISE"],["found","BROWN"],["a","SCHWA"],["shiny","WHITE"],["coin","TURQUOISE"],["and","BLACK"],["made","GRAY"],["a","SCHWA"],["loud","BROWN"],["noise","TURQUOISE"],["while","WHITE"],["playing","GRAY"],["with","SILVER"],["his","SILVER"],["toy.","TURQUOISE"]] },
    { target: "BROWN", words: [["The","SCHWA"],["brown","BROWN"],["cow","BROWN"],["walked","AUBURN"],["around","BROWN"],["the","SCHWA"],["house","BROWN"],["while","WHITE"],["a","SCHWA"],["mouse","BROWN"],["hid","SILVER"],["under","MUSTARD"],["the","SCHWA"],["old","ROSE"],["fence.","RED"]] },
  ];

  function parseTagged(text, upper) {
    return String(text || "").trim().split(/\s+/).filter(Boolean).map(function (tok) {
      var m = tok.match(/^(.*?)\[([A-Za-z]+)\]([.,!?;:]*)$/);
      if (m) return [m[1] + m[3], upper ? m[2].toUpperCase() : m[2].toLowerCase()];
      return [tok];
    });
  }
  function toTagged(words) { return words.map(function (p) { if (!p[1]) return p[0]; var m = p[0].match(/^(.*?)([.,!?;:]*)$/); return m[1] + "[" + p[1] + "]" + m[2]; }).join(" "); }

  const COLOR_KEYS = Object.keys(COLOR_INFO);
  const ED = new B5Edit({ key: "color-vowel-sound-hunt", title: "Sound Hunt sentences", defaultName: "16 color sentences",
    help: "Write each word with its Color Vowel in brackets: black[BLACK] cat[BLACK] sat[BLACK] on[OLIVE]. A word with no brackets counts as unstressed (schwa). Colors: " + COLOR_KEYS.join(", ") + ".",
    columns: [{ key: "target", label: "Hidden target color", width: "170px", options: COLOR_KEYS.filter(function (k) { return k !== "SCHWA"; }) }, { key: "text", label: "Sentence with colors", multiline: true }],
    defaults: DEF_SLIDES.map(function (s) { return { target: s.target, text: toTagged(s.words.map(function (p) { return p[1] === "SCHWA" ? [p[0]] : p; })) }; }),
    validate: function (rows) { var bad = []; rows.forEach(function (r, i) { parseTagged(r.text, true).forEach(function (p) { if (p[1] && !COLOR_INFO[p[1]]) bad.push(p[1]); }); }); return bad.length ? "Unknown color: " + bad.join(", ") : ""; },
    min: 1, onChange: function(){ location.reload(); } });
  const SLIDES = ED.rows().map(function (r) { return { target: r.target, words: parseTagged(r.text, true).map(function (p) { return [p[0], p[1] || "SCHWA"]; }) }; });

  const SENTENCE_COUNT = SLIDES.length;
  // Full deck: title slide, 16 sentence slides, closing recap slide
  const DECK = [{ type: "title" }]
    .concat(SLIDES.map(s => Object.assign({ type: "sentence" }, s)))
    .concat([{ type: "closing" }]);

  let current = 0;
  let foundCount = 0;
  let revealedTarget = false;
  let clickedIdx = new Set();

  const sentenceEl = document.getElementById("sentence");
  const progressEl = document.getElementById("progress");
  const huntPre = document.getElementById("huntPre");
  const huntReveal = document.getElementById("huntReveal");
  const swatchEl = document.getElementById("swatch");
  const revealLabel = document.getElementById("revealLabel");
  const revealIpa = document.getElementById("revealIpa");
  const revealCount = document.getElementById("revealCount");
  const dotsEl = document.getElementById("dots");

  const sentenceCard = document.getElementById("sentenceCard");
  const huntPanel = document.getElementById("huntPanel");
  const stageInner = document.getElementById("stageInner");

  function targetCount(slide) {
    return slide.words.filter(w => w[1] === slide.target).length;
  }

  function buildDots() {
    dotsEl.innerHTML = "";
    for (let i = 0; i < SENTENCE_COUNT; i++) {
      const d = document.createElement("div");
      const sentenceSlideIndex = i + 1; // offset for title slide
      d.className = "dot" + (sentenceSlideIndex === current ? " active" : "");
      dotsEl.appendChild(d);
    }
  }

  function replayFade() {
    stageInner.style.animation = "none";
    // force reflow so the animation can restart
    void stageInner.offsetWidth;
    stageInner.style.animation = "";
  }

  function render() {
    const slide = DECK[current];
    replayFade();

    // Hide both special slides by default; the matching branch below re-shows its own.
    const existingTitle = document.getElementById("titleSlide");
    const existingClosing = document.getElementById("closingSlide");
    if (existingTitle) existingTitle.style.display = "none";
    if (existingClosing) existingClosing.style.display = "none";

    if (slide.type === "title") {
      progressEl.textContent = "Welcome";
      sentenceCard.style.display = "none";
      huntPanel.style.display = "none";
      let titleEl = document.getElementById("titleSlide");
      if (!titleEl) {
        titleEl = document.createElement("div");
        titleEl.id = "titleSlide";
        titleEl.className = "title-slide";
        stageInner.insertBefore(titleEl, sentenceCard);
      }
      titleEl.style.display = "flex";
      titleEl.innerHTML =
        '<div class="big">Color Vowel Sound Hunt</div>' +
        '<div class="tag">Every English word has exactly one \u201ccolor\u201d \u2014 no matter how it\u2019s spelled. ' +
        'Click any word in a sentence to see which Color Vowel it belongs to, and hunt for every word that shares the hidden target sound.</div>' +
        '<div class="hint">Press Next to begin \u2192</div>';
      updateNav();
      return;
    }

    if (slide.type === "closing") {
      progressEl.textContent = "Recap";
      sentenceCard.style.display = "none";
      huntPanel.style.display = "none";
      let closingEl = document.getElementById("closingSlide");
      if (!closingEl) {
        closingEl = document.createElement("div");
        closingEl.id = "closingSlide";
        closingEl.className = "closing-slide";
        stageInner.appendChild(closingEl);
      }
      closingEl.style.display = "flex";
      const order = ["BLACK","RED","SILVER","OLIVE","MUSTARD","GRAY","GREEN","WHITE","ROSE","BLUE","WOODEN","PURPLE","ORANGE","AUBURN","TURQUOISE","BROWN"];
      const chips = order.map(key => {
        const info = COLOR_INFO[key];
        return '<div class="recap-chip"><div class="dot-swatch" style="background:' + info.bg +
          (key === "WHITE" ? ";box-shadow: inset 0 0 0 1px rgba(0,0,0,0.3)" : "") + '"></div>' +
          '<div class="txt"><div class="nm">' + info.name + '</div><div class="ip">' + info.keyword + '  ' + info.ipa + '</div></div></div>';
      }).join("");
      closingEl.innerHTML =
        '<div class="big" style="font-size:4vh;font-weight:700;">Nice work! \uD83C\uDF89</div>' +
        '<div class="tag">All 16 Color Vowels \u2014 same sound, any spelling.</div>' +
        '<div class="recap-grid">' + chips + '</div>' +
        '<div class="hint">Press Next to start over \u2192</div>';
      updateNav();
      return;
    }

    // sentence slide
    sentenceCard.style.display = "block";
    huntPanel.style.display = "flex";
    const total = targetCount(slide);
    foundCount = 0;
    revealedTarget = false;
    clickedIdx = new Set();

    progressEl.textContent = "Sentence " + current + " of " + SENTENCE_COUNT;
    sentenceEl.innerHTML = "";

    slide.words.forEach((pair, idx) => {
      const [text, key] = pair;
      const wrap = document.createElement("div");
      wrap.className = "word-wrap";

      const ipaTag = document.createElement("div");
      ipaTag.className = "ipa-tag";
      ipaTag.textContent = COLOR_INFO[key].ipa;

      const btn = document.createElement("button");
      btn.className = "word";
      btn.type = "button";
      btn.textContent = text;
      btn.addEventListener("click", function () { onWordClick(idx, key, btn, ipaTag); });

      wrap.appendChild(btn);
      wrap.appendChild(ipaTag);
      sentenceEl.appendChild(wrap);
    });

    huntPre.style.display = "block";
    huntReveal.classList.remove("show");
    huntReveal.classList.remove("done");
    huntPre.innerHTML = "\uD83D\uDD0D <b>" + total + "</b> word" + (total === 1 ? "" : "s") + " in this sentence share a hidden sound. Click any word to explore!";

    buildDots();
    updateNav();
  }

  function updateNav() {
    document.getElementById("prevBtn").disabled = current === 0;
    document.getElementById("nextBtn").textContent = current === DECK.length - 1 ? "Restart \u21bb" : "Next \u2192";
    document.getElementById("resetBtn").style.visibility = DECK[current].type === "sentence" ? "visible" : "hidden";
    dotsEl.style.visibility = DECK[current].type === "sentence" ? "visible" : "hidden";
  }

  function onWordClick(idx, key, btn, ipaTag) {
    if (clickedIdx.has(idx)) return;
    clickedIdx.add(idx);

    const info = COLOR_INFO[key];
    if (key === "SCHWA") {
      btn.classList.add("schwa");
    } else {
      btn.style.setProperty("--wordbg", info.bg);
      btn.style.setProperty("--wordfg", info.fg);
      btn.classList.add("revealed");
    }
    ipaTag.classList.add("show");

    const slide = DECK[current];
    if (key === slide.target) {
      foundCount++;
      btn.classList.add("target-hit");
      const total = targetCount(slide);

      if (!revealedTarget) {
        revealedTarget = true;
        huntPre.style.display = "none";
        huntReveal.classList.add("show");
        swatchEl.style.background = info.bg === "none" ? "#ccc" : info.bg;
        swatchEl.style.border = key === "WHITE" ? "1px solid rgba(0,0,0,0.3)" : "none";
        revealLabel.textContent = info.name.toUpperCase();
        revealIpa.textContent = info.ipa;
      }
      revealCount.textContent = foundCount + " of " + total + " found";
      if (foundCount === total) {
        huntReveal.classList.add("done");
      }
    }
  }

  function goNext() {
    current = (current + 1) % DECK.length;
    render();
  }
  function goPrev() {
    if (current > 0) { current--; render(); }
  }

  document.getElementById("nextBtn").addEventListener("click", goNext);
  document.getElementById("prevBtn").addEventListener("click", goPrev);
  document.getElementById("resetBtn").addEventListener("click", render);

  document.getElementById("fsBtn").addEventListener("click", function () {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(function () {});
      this.textContent = "⤢ Exit fullscreen";
    } else {
      document.exitFullscreen();
      this.textContent = "⛶ Fullscreen";
    }
  });
  document.addEventListener("fullscreenchange", function () {
    document.getElementById("fsBtn").textContent = document.fullscreenElement ? "⤢ Exit fullscreen" : "⛶ Fullscreen";
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); goNext(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); goPrev(); }
    else if (e.key.toLowerCase() === "r") { render(); }
  });

  render();
})();
</script>
